name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        run: python -m py_compile main.py qt_app.py qt_graph.py graph_model.py macro_core.py app_settings.py visual_script.py image_matcher.py ocr_reader.py windows_input.py update_service.py project_config.py
      - name: Smoke-build Windows package
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        run: |
          python -m pip install pyinstaller==6.21.0
          python -m PyInstaller --noconfirm --clean --onedir --noupx --windowed --name MacroPilot --collect-submodules pynput --collect-submodules mss --collect-submodules winrt main.py
          .\dist\MacroPilot\MacroPilot.exe --smoke-test
