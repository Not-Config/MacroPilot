name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Inspect application version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from macro_core import APP_VERSION; print(APP_VERSION)"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "APP_VERSION has an unsupported value: $version"
          }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = if ($LASTEXITCODE -eq 0) { "true" } else { "false" }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "exists=$exists" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        if: steps.release.outputs.exists != 'true'
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        if: steps.release.outputs.exists != 'true'
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        if: steps.release.outputs.exists != 'true'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MacroPilot --collect-submodules pynput main.py
      - name: Package release assets
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/MacroPilot -Force | Out-Null
          Copy-Item dist/MacroPilot.exe release/MacroPilot/
          Copy-Item README.md,SUPPORT.md,CHANGELOG.md release/MacroPilot/
          Compress-Archive -Path release/MacroPilot -DestinationPath MacroPilot-windows.zip -Force
          git archive --format=zip --prefix=MacroPilot/ -o MacroPilot-source.zip HEAD
      - name: Create version tag
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          git fetch --tags --force
          git rev-parse --verify "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Tag $tag already points to another commit"
            }
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "MacroPilot $tag"
            git push origin $tag
          }
      - name: Publish GitHub Release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" `
            dist/MacroPilot.exe `
            MacroPilot-windows.zip `
            MacroPilot-source.zip `
            --verify-tag `
            --generate-notes `
            --title "MacroPilot ${{ steps.release.outputs.version }}"
