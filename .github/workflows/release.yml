name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = python -c "from macro_core import APP_VERSION; print(APP_VERSION)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match APP_VERSION $version"
          }
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MacroPilot --collect-submodules pynput main.py
      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/MacroPilot -Force | Out-Null
          Copy-Item dist/MacroPilot.exe release/MacroPilot/
          Copy-Item README.md,SUPPORT.md,CHANGELOG.md release/MacroPilot/
          Compress-Archive -Path release/MacroPilot -DestinationPath MacroPilot-windows.zip -Force
          git archive --format=zip --prefix=MacroPilot/ -o MacroPilot-source.zip HEAD
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            MacroPilot-windows.zip `
            MacroPilot-source.zip `
            --verify-tag `
            --generate-notes `
            --title "MacroPilot ${{ github.ref_name }}"

